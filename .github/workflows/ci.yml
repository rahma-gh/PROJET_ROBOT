name: CPS CI Pipeline

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cps-test-image .

      - name: Run tests inside container with port readiness check
        run: |
          mkdir -p output
          docker run --rm \
            -v ${{ github.workspace }}/output:/app/output \
            cps-test-image \
            /bin/bash -c "
              # Start CoppeliaSim in background
              /app/start_coppeliasim.sh &
              
              # Wait for ZMQ server to be ready on port 23000
              echo 'Waiting for ZMQ Remote API server to be ready...'
              for i in {1..120}; do
                if nc -z localhost 23000 2>/dev/null; then
                  echo 'ZMQ server is ready on port 23000 after '\$i' seconds'
                  break
                fi
                echo '  waiting... ('\$i's / 120s)'
                sleep 1
              done
              
              if [ \$i -eq 120 ]; then
                echo 'ZMQ server failed to start within 120 seconds'
                exit 1
              fi
              
              # Additional small delay to ensure scene is settled
              sleep 2
              
              # Run the tests
              echo '=== Running pytest ==='
              pytest --timeout=180 --html=report.html --self-contained-html
              
              # Store exit code
              EXIT_CODE=\$?
              
              # Ensure CoppeliaSim is terminated
              pkill -f coppeliaSim || true
              
              exit \$EXIT_CODE
            "

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: output/report.html
        if: always()  # Upload even if tests fail
